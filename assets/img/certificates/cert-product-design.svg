<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 420" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap');
      .cert-title { font-family: 'Playfair Display', Georgia, serif; font-weight: 700; fill: #0D223D; }
      .cert-sans { font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; }
      .cert-muted { fill: #6B7E93; }
      .cert-light { fill: #8E9EAF; }
    </style>
    <linearGradient id="curveGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF1E6" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FCF8F3" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="cardShadow2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0D223D" flood-opacity="0.04"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="320" height="420" rx="8" fill="#FFFFFF" stroke="#E6E0D8" stroke-width="1.2" filter="url(#cardShadow2)"/>

  <!-- Delicate Organic Corner Curves (Subtle Peach/Orange Tint) -->
  <path d="M 205 0 Q 285 28 320 125 L 320 0 Z" fill="url(#curveGrad2)"/>
  <path d="M 230 0 Q 295 40 320 155" fill="none" stroke="#F8DFCE" stroke-width="1"/>
  <path d="M 0 345 Q 35 378 70 420 L 0 420 Z" fill="url(#curveGrad2)"/>
  <path d="M 0 315 Q 50 365 90 420" fill="none" stroke="#F8DFCE" stroke-width="1"/>

  <!-- Tiny Restrained Accent Dots -->
  <circle cx="278" cy="118" r="3.5" fill="#FF7014"/>
  <circle cx="52" cy="350" r="3" fill="#FF7014"/>

  <!-- Inner Hairline Border Frame -->
  <rect x="14" y="14" width="292" height="392" rx="4" fill="none" stroke="#ECE6DC" stroke-width="0.8"/>

  <!-- Top Monogram Brand Mark -->
  <g transform="translate(160, 48)">
    <path d="M -11 18 L 0 -10 L 11 18 H 6 L 3.5 11 H -3.5 L -6 18 Z M 0 1.5 L -2.4 8 H 2.4 Z" fill="#0D223D"/>
  </g>

  <!-- Certificate Heading -->
  <text x="160" y="94" text-anchor="middle" class="cert-title" font-size="14" letter-spacing="2.2">CERTIFICATE</text>
  <text x="160" y="108" text-anchor="middle" class="cert-sans" font-size="7" font-weight="600" fill="#6B7E93" letter-spacing="2">OF COMPLETION</text>

  <!-- Certification Statement -->
  <text x="160" y="138" text-anchor="middle" class="cert-sans cert-light" font-size="7.5">This certifies that</text>
  <text x="160" y="165" text-anchor="middle" class="cert-title" font-size="17">Your Name</text>
  <line x1="95" y1="175" x2="225" y2="175" stroke="#E2DDD5" stroke-width="0.75"/>

  <text x="160" y="196" text-anchor="middle" class="cert-sans cert-light" font-size="7">has successfully completed the</text>
  <text x="160" y="212" text-anchor="middle" class="cert-title" font-size="9.5">Product Design Fundamentals</text>

  <!-- Watermark Security Emblem -->
  <circle cx="160" cy="265" r="20" fill="none" stroke="#F0EBE1" stroke-width="1"/>
  <circle cx="160" cy="265" r="16" fill="none" stroke="#EAE5DC" stroke-width="0.75" stroke-dasharray="2 2"/>
  <polygon points="160,253 163,261 172,261 165,266 167,275 160,270 153,275 155,266 148,261 157,261" fill="#F8EFE4"/>

  <!-- Signature Block (Left) -->
  <g transform="translate(62, 325)">
    <!-- Realistic Cursive Signature -->
    <path d="M 6 0 C 12 -14, 20 -15, 27 2 C 33 11, 39 -3, 48 -1 C 54 2, 59 -4, 66 3" fill="none" stroke="#0D223D" stroke-width="1.3" stroke-linecap="round"/>
    <line x1="0" y1="10" x2="72" y2="10" stroke="#0D223D" stroke-width="0.75"/>
    <text x="36" y="22" text-anchor="middle" class="cert-sans" font-size="6" font-weight="600" fill="#7C8F9F" letter-spacing="1">SIGNATURE</text>
  </g>

  <!-- Date Block (Right) -->
  <g transform="translate(196, 325)">
    <text x="31" y="4" text-anchor="middle" class="cert-sans" font-size="7.5" font-weight="600" fill="#0D223D">MM YYYY</text>
    <line x1="0" y1="10" x2="62" y2="10" stroke="#0D223D" stroke-width="0.75"/>
    <text x="31" y="22" text-anchor="middle" class="cert-sans" font-size="6" font-weight="600" fill="#7C8F9F" letter-spacing="1">DATE</text>
  </g>
</svg>
